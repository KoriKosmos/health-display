services:
  health-display:
    build: .
    image: health-display:local
    container_name: health-display
    restart: unless-stopped
    shm_size: 1gb
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CUSTOM_USER=maan
      - PASSWORD=${WEB_PASSWORD}
    volumes:
      - ./data:/config
      - ./config.env:/config/.config/health-display/config.env:ro
    ports:
      - "3011:3001"   # web desktop (https) — log in to Discord here once
      - "8766:8766"   # phone push endpoint (POST /push), see config.env.example
